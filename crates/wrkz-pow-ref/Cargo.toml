[package]
name = "wrkz-pow-ref"
description = "The reference C of wrkzcoin 8d89d7bf, vendored unchanged: Keccak and the ref10 curve code (feature `curve`, still called by wrkz-pow's curve module) and, behind the `pow` feature, the CryptoNight family, argon2 and tree hash that wrkz-pow's Rust port is tested against. See spec/02-hashing.md."
version.workspace = true
edition.workspace = true
# `c/` is the C++ repository's C code, unchanged, under the notices its LICENSE
# collects (the same file as this repository's) and each file's header names:
# LGPL-3.0 or later (CryptoNote), BSD-3-Clause (Monero), GPL-3.0 or later
# (TurtleCoin, WrkzCoin), and MIT for argon2 (c/argon2/LICENSE).
license = "GPL-3.0-or-later AND LGPL-3.0-or-later AND BSD-3-Clause AND MIT"
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["curve"]
# Keccak, the ref10 curve code and `c/cn_shim.c`. This is the only C that
# reaches a shipped binary: `wrkz_pow::curve` calls it until a native curve
# port lands. On that day `wrkz-pow` switches this dependency to
# `default-features = false`, the build script compiles nothing, and the C
# compiler drops out of the build instructions — one line, because the seam is
# here now rather than being cut then.
curve = []
# The proof-of-work C (CryptoNight, finalizers, argon2, tree hash). Nothing in a
# shipped binary enables it: wrkz-pow's tests and the fuzz targets do, to compare
# the Rust port against it. It links against the Keccak of `curve`.
pow = ["curve"]

[build-dependencies]
cc = { workspace = true }

[lints]
workspace = true
