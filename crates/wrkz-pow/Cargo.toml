[package]
name = "wrkz-pow"
description = "WrkzCoin proof-of-work and hashing primitives in Rust: Keccak, the CryptoNight family, Chukwa (argon2id), tree hash and check_hash, plus the ed25519 operations, which still call the reference C in wrkz-pow-ref."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Feature `curve` only (the crate's default): the ref10 code behind
# `wrkz_pow::curve`. When the native curve port lands this becomes
# `default-features = false` and no shipped binary compiles C.
wrkz-pow-ref = { workspace = true }
getrandom = { workspace = true }
keccak = { workspace = true }
argon2 = { workspace = true }
groestl = { workspace = true }
jh = { workspace = true }
skein = { workspace = true }

# In a browser (the Rust Pluton Wallet web build) the CSPRNG behind
# `curve::random_scalar` is `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
hex = { workspace = true }
# The C proof of work, as the oracle for tests/reference_diff.rs.
wrkz-pow-ref = { workspace = true, features = ["pow"] }

[lints]
workspace = true
