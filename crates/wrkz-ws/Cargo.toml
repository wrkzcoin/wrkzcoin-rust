[package]
name = "wrkz-ws"
description = "WebSocket (RFC 6455) framing and opening handshake for the daemon's event stream and the wallets that follow it: std only, no async runtime, bounded everywhere."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `Sec-WebSocket-Accept` is base64(SHA-1(key ‖ GUID)) (RFC 6455 §4.2.2). The
# same RustCrypto family, and the same `digest` release, as the workspace's
# sha2, so it adds one small crate and no second version of anything.
sha1 = { workspace = true }

[lints]
workspace = true
