# Rust Pluton Wallet is its own workspace: it pulls in a GUI toolkit, and it
# builds for Android and the browser, neither of which the programs in the
# root workspace do. The root Cargo.toml excludes this directory.
[workspace]

[package]
name = "rust-pluton-wallet"
description = "Rust Pluton Wallet: the WrkzCoin wallet for Windows, macOS, Linux, Android and the browser, on the Rust wallet core."
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wrkzcoin/wrkzcoin-rust"
publish = false

[lib]
name = "rust_pluton_wallet"
# `cdylib` is what Android loads and what wasm-bindgen wraps; `lib` is what the
# desktop binary and the tests use.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "rust-pluton-wallet"
path = "src/main.rs"

[dependencies]
# The wallet core, without its command-line front ends or its blocking HTTP
# client: the platform layers here supply the transport.
wrkz-wallet = { path = "../../crates/wrkz-wallet", default-features = false }
wrkz-primitives = { path = "../../crates/wrkz-primitives" }
wrkz-pow = { path = "../../crates/wrkz-pow" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Slint under its royalty-free licence, which asks that the application show
# the "About Slint" notice — Pluton's About screen does.
# `renderer-software` is the fallback where OpenGL is missing or broken (an
# old virtual machine, a locked-down desktop): SLINT_BACKEND=winit-software
# then draws without the GPU. It is also what a headless screenshot uses.
slint = { version = "=1.17.1", default-features = false, features = ["compat-1-2", "std", "renderer-femtovg", "renderer-software", "accessibility"] }

# Desktop: Windows, macOS and Linux.
[target.'cfg(not(any(target_os = "android", target_family = "wasm")))'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["backend-winit"] }
wrkz-wallet = { path = "../../crates/wrkz-wallet", default-features = false, features = ["native"] }
dirs = "6"

# Android: the same native transport, with the activity backend.
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["backend-android-activity-06"] }
wrkz-wallet = { path = "../../crates/wrkz-wallet", default-features = false, features = ["native"] }

# The browser: the wallet runs in a Web Worker, the UI on the page.
[target.'cfg(target_family = "wasm")'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["backend-winit"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Worker", "MessageEvent", "XmlHttpRequest", "DedicatedWorkerGlobalScope", "console"] }
console_error_panic_hook = "0.1"

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
opt-level = 3
# A wallet ships one binary per platform; size matters most in the browser.
lto = "thin"
