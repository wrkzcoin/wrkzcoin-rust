[package]
name = "wrkz-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wrkz-primitives = { path = "../crates/wrkz-primitives" }
wrkz-p2p = { path = "../crates/wrkz-p2p" }
wrkz-pow = { path = "../crates/wrkz-pow" }
wrkz-pow-ref = { path = "../crates/wrkz-pow-ref", features = ["pow"] }
# The daemon's hand-written HTTP/1.1 and JSON parsers, which read a public
# socket, and the record decoders that read a database someone handed over.
wrkz-rpc = { path = "../crates/wrkz-rpc" }
wrkz-storage = { path = "../crates/wrkz-storage" }
# `lite-snapshot` for the `.litesnap` container an operator downloads.
wrkz-chain = { path = "../crates/wrkz-chain", features = ["lite-snapshot"] }
# The peer state file, read at start-up before the node has spoken to anybody.
wrkz-node = { path = "../crates/wrkz-node" }
# The wallet container's JSON schema. No front ends and no HTTP client: the
# file format is the whole of what is fuzzed here.
wrkz-wallet = { path = "../crates/wrkz-wallet", default-features = false }
# The WebSocket framing of the daemon's `GET /ws` and of every wallet that
# follows it.
wrkz-ws = { path = "../crates/wrkz-ws" }

# Each target is a separate binary; `cargo fuzz list` enumerates them.
[[bin]]
name = "block"
path = "fuzz_targets/block.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction"
path = "fuzz_targets/transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tx_extra"
path = "fuzz_targets/tx_extra.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kv"
path = "fuzz_targets/kv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "p2p_messages"
path = "fuzz_targets/p2p_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pow_diff"
path = "fuzz_targets/pow_diff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json"
path = "fuzz_targets/json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wallet_file"
path = "fuzz_targets/wallet_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "db_records"
path = "fuzz_targets/db_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "peer_state"
path = "fuzz_targets/peer_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lite_snapshot"
path = "fuzz_targets/lite_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_frame"
path = "fuzz_targets/ws_frame.rs"
test = false
doc = false
bench = false

# Its own workspace so the root workspace and cargo-fuzz do not conflict.
[workspace]
